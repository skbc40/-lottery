<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로또 번호 추천</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #141b2f;
    --text: #f1f5f9;
    --sub: #8b96b0;
    --accent: #6366f1;
    --accent2: #a855f7;
    --neon: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #1e1b4b, #05060f 70%);
    font-family: "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--text);
    padding: 20px;
  }
  .card {
    position: relative;
    background: linear-gradient(180deg, #161d34, #0e1425);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 20px;
    padding: 40px 32px;
    width: 100%;
    max-width: 440px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.02) inset;
    overflow: hidden;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
    letter-spacing: 0.02em;
  }
  p.desc {
    color: var(--sub);
    margin: 0 0 28px;
    font-size: 0.9rem;
  }

  /* ===== Analysis panel ===== */
  .analysis {
    margin-bottom: 22px;
    text-align: left;
    background: #0a0e1c;
    border: 1px solid rgba(99,102,241,0.35);
    border-radius: 14px;
    padding: 16px 16px 14px;
    box-shadow: 0 0 30px rgba(99,102,241,0.15) inset, 0 0 18px rgba(99,102,241,0.25);
    font-family: "Consolas", "SFMono-Regular", ui-monospace, monospace;
  }
  .scan-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .scan-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #c7d2fe;
  }
  .scan-title .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--neon);
    box-shadow: 0 0 8px var(--neon), 0 0 16px var(--neon);
    animation: blink 0.9s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }
  .scan-percent {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--neon);
    text-shadow: 0 0 10px rgba(74,222,128,0.7);
    font-variant-numeric: tabular-nums;
  }

  .progress-track {
    position: relative;
    width: 100%;
    height: 8px;
    background: rgba(255,255,255,0.06);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .progress-fill {
    position: relative;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent2), var(--neon));
    background-size: 200% 100%;
    animation: gradientMove 1.4s linear infinite;
    border-radius: 999px;
    box-shadow: 0 0 12px rgba(168,85,247,0.7);
    transition: width 0.2s ease;
  }
  @keyframes gradientMove {
    to { background-position: 200% 0; }
  }

  .number-grid {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 4px;
    margin-bottom: 12px;
  }
  .cell {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.62rem;
    color: #4b5578;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 5px;
    transition: background 0.08s ease, color 0.08s ease, box-shadow 0.08s ease, transform 0.08s ease;
  }
  .cell.hit {
    color: #e0e7ff;
    background: rgba(99,102,241,0.55);
    box-shadow: 0 0 10px rgba(99,102,241,0.9);
    transform: scale(1.12);
  }
  .cell.hot {
    color: #052e16;
    background: var(--neon);
    box-shadow: 0 0 12px rgba(74,222,128,0.9);
    font-weight: 700;
  }

  .analysis-log {
    font-size: 0.72rem;
    line-height: 1.6;
    color: #7dd3a0;
    min-height: 78px;
    max-height: 78px;
    overflow: hidden;
    display: flex;
    flex-direction: column-reverse;
  }
  .analysis-log span {
    animation: fadeIn 0.2s ease;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .analysis-log span::before {
    content: "> ";
    color: #4b5578;
  }
  .analysis-log .cursor {
    display: inline-block;
    width: 6px;
    height: 11px;
    background: var(--neon);
    margin-left: 2px;
    animation: blink 0.8s steps(1) infinite;
    vertical-align: middle;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== Result balls ===== */
  .balls {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 60px;
    margin-bottom: 28px;
  }
  .ball-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 8px;
  }
  .ball-row .set-label {
    width: 20px;
    font-size: 0.75rem;
    color: var(--sub);
    text-align: right;
    margin-right: 2px;
  }
  .ball {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.9rem;
    color: #fff;
    flex-shrink: 0;
    background: #334155;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .ball.spinning {
    animation: shake 0.1s linear infinite;
    filter: blur(0.3px);
  }
  .ball.locked {
    animation: pop 0.35s ease;
  }
  @keyframes shake {
    0% { transform: translateY(0); }
    50% { transform: translateY(-2px); }
    100% { transform: translateY(0); }
  }
  @keyframes pop {
    0% { transform: scale(0.5); }
    60% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  .ball.b1 { background: #fbbf24; }
  .ball.b2 { background: #60a5fa; }
  .ball.b3 { background: #f87171; }
  .ball.b4 { background: #a3a3a3; }
  .ball.b5 { background: #4ade80; }
  .ball.b6 { background: #c084fc; }

  button {
    appearance: none;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    padding: 14px 0;
    width: 100%;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    box-shadow: 0 8px 20px rgba(99,102,241,0.35);
  }
  button:hover { box-shadow: 0 8px 26px rgba(99,102,241,0.55); }
  button:active { transform: scale(0.97); }
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    box-shadow: none;
  }

  .history {
    margin-top: 24px;
    text-align: left;
    font-size: 0.8rem;
    color: var(--sub);
    max-height: 140px;
    overflow-y: auto;
  }
  .history div {
    padding: 4px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
</style>
</head>
<body>

<div class="card">
  <h1>🎱 로또 번호 추천</h1>
  <p class="desc">버튼을 누르면 무작위로 로또 번호 6개를 추천해드려요</p>

  <div class="analysis" id="analysis" hidden>
    <div class="scan-header">
      <span class="scan-title"><span class="dot"></span>AI 번호 분석 엔진</span>
      <span class="scan-percent" id="scanPercent">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="number-grid" id="numberGrid"></div>
    <div class="analysis-log" id="analysisLog"></div>
  </div>

  <div class="balls" id="balls"></div>

  <button id="generateBtn">번호 추천 받기</button>

  <div class="history" id="history"></div>
</div>

<script>
  const ballsEl = document.getElementById('balls');
  const historyEl = document.getElementById('history');
  const btn = document.getElementById('generateBtn');
  const analysisEl = document.getElementById('analysis');
  const analysisLogEl = document.getElementById('analysisLog');
  const progressFillEl = document.getElementById('progressFill');
  const scanPercentEl = document.getElementById('scanPercent');
  const numberGridEl = document.getElementById('numberGrid');

  const ANALYSIS_STEPS = [
    '최근 1,180회차 당첨 데이터 로딩...',
    '번호별 출현 빈도 계산 중...',
    '홀짝 비율 / 구간 분포 분석 중...',
    '연속 번호·동반 출현 패턴 검사 중...',
    '핫넘버 / 콜드넘버 가중치 산출 중...',
    '몬테카를로 조합 시뮬레이션 실행 중...',
    '최적 추천 조합 확정 중...'
  ];

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function buildGrid() {
    numberGridEl.innerHTML = '';
    for (let n = 1; n <= 45; n++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.textContent = n;
      cell.dataset.num = n;
      numberGridEl.appendChild(cell);
    }
  }

  function addLogLine(text) {
    // remove previous cursor
    const prevCursor = analysisLogEl.querySelector('.cursor');
    if (prevCursor) prevCursor.remove();

    const line = document.createElement('span');
    line.textContent = text;
    const cursor = document.createElement('i');
    cursor.className = 'cursor';
    line.appendChild(cursor);
    analysisLogEl.prepend(line);
  }

  async function runAnalysis() {
    analysisLogEl.innerHTML = '';
    progressFillEl.style.width = '0%';
    scanPercentEl.textContent = '0%';
    buildGrid();
    analysisEl.hidden = false;

    const cells = Array.from(numberGridEl.children);
    let scanTimer = setInterval(() => {
      cells.forEach(c => c.classList.remove('hit'));
      const pickCount = 5 + Math.floor(Math.random() * 4);
      const shuffled = [...cells].sort(() => Math.random() - 0.5);
      shuffled.slice(0, pickCount).forEach(c => c.classList.add('hit'));
    }, 80);

    for (let i = 0; i < ANALYSIS_STEPS.length; i++) {
      await sleep(320);
      addLogLine(ANALYSIS_STEPS[i]);
      const pct = Math.round(((i + 1) / ANALYSIS_STEPS.length) * 100);
      progressFillEl.style.width = pct + '%';
      scanPercentEl.textContent = pct + '%';
    }

    clearInterval(scanTimer);
    cells.forEach(c => c.classList.remove('hit'));

    // highlight "hot numbers" as the finale
    const hotPicks = [...cells].sort(() => Math.random() - 0.5).slice(0, 8);
    hotPicks.forEach(c => c.classList.add('hot'));

    await sleep(450);
    analysisEl.hidden = true;
  }

  function getBallColorClass(index) {
    return 'b' + ((index % 6) + 1);
  }

  function generateLottoNumbers() {
    const numbers = new Set();
    while (numbers.size < 6) {
      numbers.add(Math.floor(Math.random() * 45) + 1);
    }
    return Array.from(numbers).sort((a, b) => a - b);
  }

  function generateFiveSets() {
    const sets = [];
    for (let i = 0; i < 5; i++) {
      sets.push(generateLottoNumbers());
    }
    return sets;
  }

  function buildBallSkeleton(sets) {
    ballsEl.innerHTML = '';
    const ballRefs = [];
    sets.forEach((numbers, setIndex) => {
      const row = document.createElement('div');
      row.className = 'ball-row';

      const label = document.createElement('span');
      label.className = 'set-label';
      label.textContent = (setIndex + 1) + '.';
      row.appendChild(label);

      const rowRefs = [];
      numbers.forEach((num, i) => {
        const div = document.createElement('div');
        div.className = 'ball spinning ' + getBallColorClass(i);
        div.textContent = '?';
        row.appendChild(div);
        rowRefs.push(div);
      });

      ballsEl.appendChild(row);
      ballRefs.push(rowRefs);
    });
    return ballRefs;
  }

  async function revealBallsWithSlotEffect(sets) {
    const ballRefs = buildBallSkeleton(sets);
    const allBalls = ballRefs.flat();

    // spin: rapidly show random numbers on every ball
    const spinTimer = setInterval(() => {
      allBalls.forEach(el => {
        if (el.classList.contains('spinning')) {
          el.textContent = Math.floor(Math.random() * 45) + 1;
        }
      });
    }, 60);

    await sleep(500);

    // lock balls in one by one, row by row, for a dramatic reveal
    for (let setIndex = 0; setIndex < sets.length; setIndex++) {
      for (let i = 0; i < sets[setIndex].length; i++) {
        await sleep(90);
        const el = ballRefs[setIndex][i];
        el.classList.remove('spinning');
        el.textContent = sets[setIndex][i];
        el.classList.add('locked');
      }
    }

    clearInterval(spinTimer);
  }

  function addHistory(sets) {
    const time = new Date().toLocaleTimeString('ko-KR');
    sets.forEach((numbers, i) => {
      const row = document.createElement('div');
      row.textContent = `${time} [${i + 1}] - ${numbers.join(', ')}`;
      historyEl.prepend(row);
    });
  }

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    ballsEl.innerHTML = '';
    const originalLabel = btn.textContent;
    btn.textContent = '분석 중...';

    await runAnalysis();

    const sets = generateFiveSets();
    await revealBallsWithSlotEffect(sets);
    addHistory(sets);

    btn.textContent = originalLabel;
    btn.disabled = false;
  });
</script>

</body>
</html>
